services:
  db:
    image: postgres:17
    container_name: pirouette-db
    environment:
      POSTGRES_USER: pirouette
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: pirouette
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pirouette-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pirouette -d pirouette"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pirouette-pgdata: